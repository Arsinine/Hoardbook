name: CI

# Multi-platform test matrix. Motivated by a latent Windows-only DPAPI bug that
# shipped undetected because the hb-dpapi tests are `#[cfg(target_os = "windows")]`
# and CI/dev ran only on Linux. Every `#[cfg(target_os = ...)]`-gated test must run
# on its native runner, so a green Linux run is no longer treated as "tests pass".
#
# macOS is deliberately ABSENT from this matrix — removed 2026-08-31 (owner), applying the
# QURATOR-131/132 ruling consistently: macOS is NOT SUPPORTED. release.yml dropped its macOS
# legs on 2026-08-26 and this leg was the leftover.
#
# The rule above does NOT argue for keeping it, which is the trap to avoid: there are ZERO
# `#[cfg(target_os = "macos")]`-gated TESTS. The only macOS-gated code is three lines in
# commands/diagnostics.rs that shell out to `open`, plus a `not(target_os = "macos")` branch
# in lib.rs — nothing a runner can exercise, so the leg proved only that three lines compile
# for a platform that is never shipped. It also put a green "test (macos-latest)" check on
# every PR, implying a support level that does not exist. Removing it costs nothing
# measurable: the repo is public (no billing) and macOS was never the critical path
# (4m03s vs windows-latest at 6m59s on run 33383190145).
#
# Do NOT re-add it as an oversight. QURATOR-132 is PARKED, not closed — if macOS is ever
# un-parked, re-add this leg in the SAME change that restores the release legs.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      # QURATOR-111 #16: SHA-pinned (was @stable, a moving branch). Resolved via
      # gh api repos/dtolnay/rust-toolchain/commits/stable. The action's `toolchain`
      # input still defaults to `stable`, so this pin does not freeze the Rust version.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable (branch head 2026-08-05)
        with:
          components: clippy

      # QURATOR-111 #16: SHA-pinned (was @v2). Resolved via gh api
      # repos/Swatinem/rust-cache/commits/v2.9.2 — the v2 branch head == the v2.9.2 tag.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # hb-app embeds frontendDist (`ui/build`) at compile time via
      # `tauri::generate_context!`, so the frontend must be built before any
      # `cargo` command that compiles hb-app, on every OS in the matrix.
      # QURATOR-255 (2026-09-15 scan): bare `npm ci` also executes every lockfile package's
      # install/postinstall/prepare scripts as the runner user, and on a fork PR the whole
      # tree — package-lock.json included — is attacker-authored. Exactly two locked packages
      # declare install scripts (esbuild; fsevents, which is darwin-only and never installs
      # on these runners), so scripts are disabled wholesale and re-enabled for esbuild
      # alone, by name: a PR that adds a new script-carrying dependency gets NO script
      # execution, and the one vetted build dep keeps working.
      - name: Build frontend (required to compile hb-app)
        working-directory: crates/hb-app/ui
        # QURATOR-278: this step runs on windows-latest too, where a multi-line run: with no
        # shell: defaults to pwsh — and pwsh gates the step on the LAST command's exit code,
        # so a failed `npm ci --ignore-scripts` was masked whenever the later `npm rebuild
        # esbuild` / `npm run build` exited 0. bash runs the body under fail-fast semantics.
        # (The regression arrived when this step went from one `npm ci` to three commands;
        # single-command steps like `cargo test --workspace` need no shell: — their only
        # command IS the last one — and the only other multi-line run: in this job is
        # ubuntu-only, so this was the sole gap.)
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
          npm run build

      - name: cargo test --workspace
        run: cargo test --workspace --locked

      # INV-4′ (M18): **Hoardbook moves no COLLECTION FILES.** A transport plane exists (the manifest
      # plane, `hb-app/src/transport.rs`) and is structurally limited to `ManifestPayload`.
      #
      # This sweep is INV-4′ enforcement mechanism 3, and it was REWRITTEN, not weakened, in the same
      # commit that added the iroh dep. The retired probes grepped for the *dep itself* — correct
      # while no plane existed, red by construction once one does — so deleting them without a
      # replacement is exactly the failure mode INVARIANT_AUDIT §6b describes. The replacement greps
      # for the constructs that would make the plane a FILE mover instead:
      #   · a download queue / verb anywhere (the retired plane's orchestration),
      #   · filesystem reads INSIDE the transport module (a plane that opens a file is moving files),
      #   · the retired xfer crypto in hb-core (unchanged — that shape is still forbidden; addresses
      #     ride a sealed ticket in a DM, never the public presence event).
      # Greps code CONSTRUCTS, not prose: every hit on a COMMENT line is dropped, because describing
      # a boundary is not crossing it and a module that documents what it refuses to do names those
      # things. The retired sweep claimed this property but did not implement it — it matched a
      # `seal_addrs` mention in `hb-core::ticket`'s doc comment, so it was latently red from W1 slice
      # 1 and would have failed the first push. Comment-stripping is what makes the property real.
      # Ubuntu-only — one grep pass suffices.
      - name: INV-4′ sweep — the plane carries manifests, never collection files
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          # Drop `path:line:` hits whose content begins a comment (`//`, `///`, `//!`, `#`, `*`,
          # `/*`, `<!--`). A commented-out construct is not a construct.
          code_only() { grep -vE '^[^:]*:[0-9]+:[[:space:]]*(//|#|\*|/\*|<!--)'; }
          sweep() { local desc="$1"; shift; if out=$(grep -rnE "$@" 2>/dev/null | code_only); then echo "::error::INV-4′ regression — $desc:"; echo "$out"; fail=1; fi; }
          # The transport module is the whole surface allowed to hold a connection.
          # `transport_state.rs` joined the surface in W4 — it names `iroh::Endpoint`, so the
          # unlisted-iroh-users check below flagged it the moment it was written. That is the guard
          # working: a new transport module is unswept until someone says so out loud, and being
          # listed means it must satisfy every probe (no fs, no path arguments) too.
          TRANSPORT_FILES="crates/hb-app/src/transport.rs crates/hb-app/src/conn.rs crates/hb-app/src/transport_state.rs"
          # A hand-maintained list fails two ways, both confirmed by trying them:
          #   · rename or delete a listed file and `grep` exits 2, which makes the `if` FALSE — the
          #     probe goes SILENTLY GREEN on the very file it exists to watch;
          #   · add a new transport module and it is simply unswept.
          # So the list is verified rather than trusted: every listed file must exist, and every file
          # that touches iroh must be listed. Nothing can hold a QUIC connection without naming iroh,
          # which makes that the honest definition of "the transport surface".
          for f in $TRANSPORT_FILES; do
            if [ ! -f "$f" ]; then
              echo "::error::INV-4′ sweep is stale — it lists $f, which does not exist. A renamed or"
              echo "::error::deleted transport file makes every probe below silently pass. Update the list."
              exit 1
            fi
          done
          # The `hb-wan-it` headless WAN harness (crates/hb-app/src/wan_it/, its own `hb-wan-it` bin —
          # NOT the Tauri app) DRIVES the production transport as a measuring client: it opens an
          # `iroh::Endpoint` to dial the real plane and time it, exactly as the retired `hb-p2p-it` did.
          # It is not a transport MODULE and cannot join TRANSPORT_FILES — it legitimately creates a
          # temp data-dir (`std::fs::create_dir_all`), which the no-fs probe below forbids for the plane
          # itself. So the harness dir is subtracted from the iroh-surface scan HERE, and only here:
          # every other probe still scans it, and this filter fails CLOSED — rename the dir and its
          # files reappear in the scan, turning CI red until the filter is corrected.
          # `crates/hb-app/src/nat.rs` (QURATOR-68) is the second such case: it binds a DIAL-ONLY
          # iroh endpoint — owner ruling ③ of 2026-07-31, never the listening endpoint — purely to
          # read the relay-observed mapped address out of `net_report` and classify what kind of NAT
          # the user is behind. It carries no payload of any kind, opens no stream, and touches no
          # filesystem; it is a DIAGNOSTIC, not a transport module, so putting it in TRANSPORT_FILES
          # would mislabel the surface this guard exists to name. Subtracted by EXACT path only, so
          # it fails CLOSED exactly like the harness filter above: rename or move the file and it
          # reappears in the scan, turning CI red until this line is corrected. If nat.rs ever grows
          # a stream, a send, or an fs call, delete this exemption rather than widening it.
          # QURATOR-256 (2026-09-15 scan): the retired enumeration pattern required the literal
          # `iroh::` token, so a use-statement ALIASING the crate (`use iroh as quic;` and then
          # `quic::` paths) never matched it — an aliased module held QUIC connections while
          # sitting outside every probe below. The pattern now also flags the crate named bare
          # in use/extern-crate position (any alias or re-import), while the original
          # alternative keeps catching every qualified path and the brace/glob import forms.
          # This is file-LISTING, comments included, and that is deliberate: prose naming the
          # crate means a human has to say the file is transport-adjacent out loud too.
          # Self-tested against ci-fixtures/inv4-iroh-positive.rs in the step below.
          iroh_users=$(grep -rlE '(^|[^a-zA-Z_])(iroh::|use[[:space:]]+iroh([^a-zA-Z0-9_:]|$)|extern[[:space:]]+crate[[:space:]]+iroh([^a-zA-Z0-9_:]|$))' crates/*/src | grep -v '/wan_it/' | grep -vx 'crates/hb-app/src/nat\.rs' | sort)
          listed=$(printf '%s\n' $TRANSPORT_FILES | sort)
          if unlisted=$(comm -23 <(echo "$iroh_users") <(echo "$listed")) && [ -n "$unlisted" ]; then
            echo "::error::INV-4′ regression — these files use iroh but are not in the swept transport surface:"
            echo "$unlisted"
            echo "::error::Add them to TRANSPORT_FILES (and satisfy the probes), or move the transport code back."
            fail=1
          fi
          sweep "retired xfer crypto in hb-core"      'seal_addrs|unseal_addrs|resolve_node_key|verify_binding_token|follower_gate|SealedAddr|KIND_XFER' crates/hb-core/src
          sweep "a transfer/gate module declaration"  '^[[:space:]]*(#\[[^]]*\][[:space:]]*)*(pub(\([^)]*\))?[[:space:]]+)?mod[[:space:]]+(transfer|gate)\b' crates
          sweep "a download queue or download verb is back" 'DownloadQueue|request_download|cancel_download|DownloadRegistry' crates/hb-app/src crates/hb-app/ui/src crates/hb-core/src crates/hb-net/src
          # QURATOR-111 #5 (2026-08-23 scan): the retired pattern required `std::fs::` with
          # trailing colons, so `use std::fs;` + a bare `fs::read_to_string(...)` tripped
          # nothing. `std::fs([^a-zA-Z_]|$)` now flags the import line itself (incl. `as`/glob
          # aliases), and the bare `fs::` rule flags any module access however `fs` came into
          # scope. Self-tested against ci-fixtures/inv4-fs-positive.rs in the step below.
          sweep "the transport module reads the filesystem — the plane is moving files" 'tokio::fs|std::fs([^a-zA-Z_]|$)|(^|[^a-zA-Z_:])fs::|File::open|PathBuf|std::path::Path' $TRANSPORT_FILES
          # INV-4′ mechanism 1 is only real while `ManifestPayload`'s ONLY constructors validate. A
          # serde derive is an unvalidated public constructor: `from_str::<ManifestPayload>("[137,80]")`
          # yields a payload of PNG bytes, skipping seal/from_wire/verify_integrity AND the 16 MiB
          # ceiling. The type shipped with that derive and every test stayed green, because no test
          # tried the bypass — so the guard is a grep, not a test.
          # The retired pattern `derive\([^)]*(Serialize|Deserialize)` is file-scoped, not
          # type-scoped: it fired on the WRONG hit (2026-08-24, run 32811426755) — commit 6997243
          # (audit #19) added a `#[derive(Deserialize)]` to the PRIVATE `WireEnvelope` mirror that
          # bounds part counts DURING deserialization, making the bounded-parse gate possible, and
          # the probe red CI while naming `ManifestPayload`. A guard that misnames what it checks
          # is treated here like a vacuous one. The replacement is TYPE-SCOPED, not permissive:
          # it still fires on (a) any serde derive reaching `ManifestPayload` itself, (b) any
          # `Serialize` derive anywhere in the file, (c) a `Deserialize` on any `pub` type, or any
          # non-`WireEnvelope` type — while exempting exactly the private Deserialize-only mirror
          # that from_wire parses through. ERE cannot bind a derive attribute to the type it
          # annotates, so this is a small awk that pairs each derive with the next declared item
          # and drops comment lines the way `code_only` does.
          #
          # QURATOR-269 (2026-09-15 scan) closed three evasions in that pairing: the anchor
          # now permits LEADING WHITESPACE before the attribute (an indented derive inside a
          # nested module used to match neither rule and RESET the accumulator);
          # `#[cfg_attr(...)]` lines are FOLDED into the accumulator — `cfg_attr(all(),
          # derive(Deserialize))` is a live derive, not "some other attribute" to skip — and
          # the attribute block is held open until its parens actually BALANCE, so a
          # multi-line cfg_attr cannot drop its derive clause mid-attribute. Self-tested
          # against ci-fixtures/transport-payload-positive.rs in the step below — a claim that
          # was FALSE before this change: the "step below" tested only the no-fs probe, and
          # this probe had no positive control at all.
          if out=$(awk '
            function hit() { printf "%s:%d:%s\n", FILENAME, NR, $0; bad = 1 }
            {
              if (open_attr) {
                if ($0 !~ /^[ \t]*(\/\/|\/\*|\*)/) { d_body = d_body " " $0; depth += gsub(/\(/, "("); depth -= gsub(/\)/, ")"); if (depth <= 0) open_attr = 0 }
                next
              }
              if ($0 ~ /^[ \t]*(\/\/|\/\*|\*)/) next
              if ($0 ~ /^[ \t]*#\[derive[ \t]*\(/) { d_body = d_body " " $0; depth = gsub(/\(/, "(") - gsub(/\)/, ")"); if (depth > 0) open_attr = 1; next }
              if ($0 ~ /^[ \t]*#\[cfg_attr[ \t]*\(/) { d_body = d_body " " $0; depth = gsub(/\(/, "(") - gsub(/\)/, ")"); if (depth > 0) open_attr = 1; next }
              if ($0 ~ /^[ \t]*#/) next
              if ($0 ~ /^[ \t]*(pub([ \t]*\([^)]*\))?[ \t]+)?(struct|enum|union)[ \t]+[A-Za-z_0-9]+/) {
                if (d_body != "") {
                  d = d_body; sub(/[ \t]*\/\/.*$/, "", d)
                  vis = ($0 ~ /^[ \t]*pub/) ? "pub" : "priv"
                  name = $0
                  sub(/^[ \t]*(pub([ \t]*\([^)]*\))?[ \t]+)?(struct|enum|union)[ \t]+/, "", name)
                  sub(/[^A-Za-z_0-9].*$/, "", name)
                  if (d ~ /Serialize/ || (d ~ /Deserialize/ && !(vis == "priv" && name == "WireEnvelope"))) hit()
                }
                d_body = ""
                next
              }
              if ($0 ~ /[^ \t]/) d_body = ""
            }
            END { exit(bad ? 0 : 1) }
          ' crates/hb-core/src/transport_payload.rs 2>/dev/null); then
            echo "::error::INV-4′ regression — a serde derive reached a transport payload type, an unvalidated public constructor bypassing seal/from_wire/verify_integrity and the 16 MiB ceiling:"
            echo "$out"
            echo "::error::Only the private Deserialize-only WireEnvelope mirror (the bounded-parse gate from_wire parses through) may derive Deserialize. Anything else — a derive reaching ManifestPayload itself, any Serialize derive, or a Deserialize on a pub type — is the bypass this probe exists to catch."
            fail=1
          fi
          # Lines-examined print, so a silent probe is distinguishable from a clean one (a wrong
          # cwd or an absent file reads as clean otherwise — that trap has shipped here before).
          printf 'serde-derive probe: %s lines examined in transport_payload.rs\n' "$(wc -l < crates/hb-core/src/transport_payload.rs)"
          sweep "the transport module takes a filesystem path" 'fn [a-z_]+\([^)]*(path|file_path|save_path): *&?(str|String|Path|PathBuf)' $TRANSPORT_FILES
          # A content grep misses a file whose only tell is its NAME — an orphaned
          # `DownloadQueue.svelte` referencing nothing has no matching text inside it. Verified by
          # planting exactly that case: content-only probes stayed green.
          # `mas-inv5-no-download.test.ts` is excluded by name: it is the guard that asserts no
          # collection-file download affordance exists, and a probe that flags its own guard test is
          # broken. (Caught by running this probe before trusting it.)
          out=$(find crates/hb-app/src crates/hb-app/ui/src \
                  \( -iname '*download*' -o -iname 'transfer.*' \) \
                  ! -name 'mas-inv5-no-download.test.ts' 2>/dev/null)
          if [ -n "$out" ]; then
            echo "::error::INV-4′ regression — a download/transfer source file is back:"; echo "$out"; fail=1
          fi
          if [ "$fail" -ne 0 ]; then echo "::error::INV-4′ — Hoardbook moves no COLLECTION FILES. The above turns the manifest plane into a file mover."; exit 1; fi
          echo "INV-4′ sweep clean — the transport module carries ManifestPayload and touches no files."

      # Positive control for the no-fs probe inside the INV-4′ sweep above (QURATOR-111 #5,
      # 2026-08-23 scan). Its CWE-94 sibling has had one since QURATOR-48; this probe had none,
      # and the scan found it was EVADABLE — `use std::fs;` plus a bare `fs::read_to_string(...)`
      # contains none of the fully-qualified tokens the retired pattern required, so CI stayed
      # green while the transport module gained real fs access. A guard that cannot be shown to
      # red is indistinguishable from one that scans nothing — this repo has shipped both. The
      # fixture holds exactly that evasion; this step runs the SAME pattern-and-filter pipeline
      # as the sweep above against it and asserts it REDS. It lives under ci-fixtures/ (NOT
      # crates/), so no production probe ever scans it.
      - name: INV-4′ no-fs probe self-test — must red on the positive fixture
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        run: |
          set -uo pipefail
          code_only() { grep -vE '^[^:]*:[0-9]+:[[:space:]]*(//|#|\*|/\*|<!--)'; }
          pattern='tokio::fs|std::fs([^a-zA-Z_]|$)|(^|[^a-zA-Z_:])fs::|File::open|PathBuf|std::path::Path'
          # -H is load-bearing exactly as in the injection self-test: grep on a SINGLE explicit
          # file omits the `file:line:` prefix, and code_only anchors on that prefix.
          hits=$(grep -HnE "$pattern" ci-fixtures/inv4-fs-positive.rs 2>/dev/null | code_only)
          if [ -z "$hits" ]; then
            echo "::error::The INV-4′ no-fs probe is VACUOUS — it passed on ci-fixtures/inv4-fs-positive.rs, which holds the exact aliased-import evasion the 2026-08-23 scan described (use std::fs; + bare fs::read_to_string). The probe must catch this (QURATOR-111 #5)."
            exit 1
          fi
          n=$(printf '%s\n' "$hits" | grep -c .)
          # Negative half: the fixture's doc comments name std::fs and tokio::fs::File::open
          # deliberately — a module that documents what it refuses to do names those things. If
          # they appear here, code_only lost its anchor and every doc comment in the real
          # transport module (transport.rs lines 8/14 do exactly this) would red the build on prose.
          if fp=$(printf '%s\n' "$hits" | grep -E ':[0-9]+:[[:space:]]*(//|#|\*|/\*|<!--)'); then
            echo "::error::FALSE POSITIVE — the probe flagged a COMMENT line. code_only must keep dropping them."
            echo "$fp"
            exit 1
          fi
          echo "INV-4′ no-fs probe self-test OK — caught $n evasion(s), and exempted every comment line:"
          printf '%s\n' "$hits" | sed 's/^/  /'

      # Positive control for the iroh-surface enumeration inside the INV-4′ sweep above
      # (QURATOR-256, 2026-09-15 scan). The retired pattern's premise — "nothing can hold a
      # QUIC connection without naming iroh" — only held for the literal path prefix, so a
      # use-statement aliasing the crate escaped the enumeration, and with it every probe
      # that enumeration feeds. The fixture holds exactly that evasion; this step runs the
      # SAME enumeration pattern against it and asserts the alias form is caught. It lives
      # under ci-fixtures/ (NOT crates/), so the production enumeration never scans it.
      - name: INV-4′ iroh-surface self-test — must red on the aliased-import fixture
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        run: |
          set -uo pipefail
          if ! grep -qE '(^|[^a-zA-Z_])use[[:space:]]+iroh([^a-zA-Z0-9_:]|$)' ci-fixtures/inv4-iroh-positive.rs; then
            echo "::error::The iroh-surface enumeration is VACUOUS — it passed on ci-fixtures/inv4-iroh-positive.rs, which holds the aliased-import evasion (a use-statement renaming the crate, then aliased paths). The enumeration must catch this (QURATOR-256)."
            exit 1
          fi
          # Fixture hygiene: the fixture must demonstrate the ALIASING evasion specifically.
          # If it ever grows the literal iroh path prefix it is caught trivially and pins
          # nothing — same class as a control that passes because its own message supplied
          # the hit.
          if grep -qE '(^|[^a-zA-Z_])iroh::' ci-fixtures/inv4-iroh-positive.rs; then
            echo "::error::ci-fixtures/inv4-iroh-positive.rs contains the literal iroh path prefix — it no longer demonstrates the aliasing evasion this self-test exists to pin."
            exit 1
          fi
          echo "INV-4′ iroh-surface self-test OK — the aliased-import fixture is caught by the use-form alternative:"
          grep -nE '(^|[^a-zA-Z_])use[[:space:]]+iroh([^a-zA-Z0-9_:]|$)' ci-fixtures/inv4-iroh-positive.rs | sed 's/^/  /'

      # QURATOR-281 (2026-09-16 scan): the iroh-surface enumeration above lists files because
      # they NAME iroh in source — but a Cargo.toml dependency RENAME, `quic = { package =
      # "iroh", version = "..." }`, means the token "iroh" appears in NO source file at all:
      # the crate is imported under its local name, the file is never enumerated, never enters
      # TRANSPORT_FILES, and escapes every downstream INV-4′ probe. The manifest is the other
      # half of the surface, so this detector scans every crate manifest — and the workspace
      # root, where a rename can be declared once under [workspace.dependencies] and inherited
      # by every member as `quic = { workspace = true }` — for a dependency whose package is
      # iroh under ANY local name, failing unless that local name is in the explicit allowlist
      # below. ⚠ This ADDS a detector; it does NOT widen the INV-4′ fence — a fence breach is
      # still fixed by moving code OUT of the transport surface, never by adding to
      # TRANSPORT_FILES. A legitimate rename must be justified out loud in ALLOWED_IROH_NAMES
      # and widen the source-side enumeration pattern in the same commit.
      # Self-tested against ci-fixtures/inv4-iroh-rename-positive.toml in the step below.
      - name: INV-4′ manifest-side iroh detector — a renamed iroh dep cannot slip past the surface enumeration
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        run: |
          set -uo pipefail
          # Exactly one local name is allowed: the crate's own. Anything else mapping to
          # package "iroh" is a rename the enumeration cannot see.
          ALLOWED_IROH_NAMES="iroh"
          files=$( (find crates -name Cargo.toml -type f; [ -f Cargo.toml ] && echo Cargo.toml) | sort)
          nfiles=$(printf '%s\n' "$files" | grep -c .)
          if [ "$nfiles" -eq 0 ]; then
            echo "::error::manifest-side iroh detector examined ZERO manifests — wrong cwd or an absent tree reads as clean otherwise. Failing loudly instead."
            exit 1
          fi
          # Prints "manifest:localname" for EVERY dependency whose package resolves to iroh,
          # in every valid spelling: the key `iroh` itself (string, inline table, dotted,
          # [dependencies.iroh]) bare or QUOTED, any renamed key carrying package = "iroh"
          # or package = 'iroh' (TOML literal string), and dotted sections whose header key
          # is bare or quoted ([dependencies."quic"]). Trailing # comments are stripped
          # before matching — a # inside a quoted string is NOT a comment start — so prose
          # naming iroh cannot feed the detector. Section-aware — only *dependencies tables
          # count, so [package] metadata prose cannot feed the detector.
          decls=$(awk -f ci-fixtures/inv4-iroh-detector.awk $files 2>/dev/null)
          ndecls=$(printf '%s\n' "$decls" | grep -c . || true); ndecls=${ndecls:-0}
          # A detector that CANNOT RUN reports clean (QURATOR-281 review finding 5, the → P-5
          # shape): if awk dies — engine drift, a bad edit, a missing program file — `decls` is
          # empty, `bad` is empty, and this step echoes "clean" and exits 0 with `2>/dev/null`
          # hiding the evidence. The tree's one real declaration is the positive control: assert
          # it is present, so detector death and an unexpected tree shape both fail LOUDLY.
          if ! printf '%s\n' "$decls" | grep -qF 'crates/hb-app/Cargo.toml:iroh'; then
            echo "::error::INV-4′ manifest-side detector did not find the KNOWN iroh declaration in crates/hb-app/Cargo.toml. Either the detector failed to run (awk crash / missing ci-fixtures/inv4-iroh-detector.awk — note stderr is suppressed) or the dependency moved. A detector that cannot run reports clean, so this is failed loudly rather than trusted."
            exit 1
          fi
          for f in $files; do
            n=$(printf '%s\n' "$decls" | grep -cF -- "$f:" || true); n=${n:-0}
            printf '%s: %d iroh dependency declaration(s)\n' "$f" "$n"
          done
          bad=""
          while IFS= read -r d; do
            [ -n "$d" ] || continue
            name=${d#*:}
            ok=0
            for a in $ALLOWED_IROH_NAMES; do [ "$name" = "$a" ] && ok=1; done
            if [ "$ok" -ne 1 ]; then bad="$bad$d"$'\n'; fi
          done <<< "$decls"
          if [ -n "$bad" ]; then
            echo "::error::INV-4′ regression — a dependency on iroh is declared under a LOCAL NAME the iroh-surface enumeration cannot see:"
            printf '%s' "$bad"
            echo "::error::A renamed iroh dep means no source file names the crate, so the module never enters TRANSPORT_FILES and every no-filesystem/no-path probe is silently unswept. Declare it as iroh, or justify the local name in ALLOWED_IROH_NAMES and widen the enumeration pattern in the same commit (QURATOR-281)."
            exit 1
          fi
          echo "manifest-side iroh detector clean — $ndecls declaration(s) across $nfiles manifest(s), all under the allowlisted local name(s): $ALLOWED_IROH_NAMES."

      # Positive control for the manifest-side iroh detector above (QURATOR-281, 2026-09-16
      # scan). The fixture is a manifest-shaped fragment holding the exact evasion: a
      # dependency renamed via package = "iroh" in EVERY valid spelling (plain
      # [dependencies], target section, dotted [dependencies.NAME] section, quoted dep key,
      # quoted section header, single-quoted value), so no source file would ever name the
      # crate. This step runs the SAME awk-and-allowlist pipeline as the detector above
      # against it and asserts every rename REDS while the fixture's negatives — a benign
      # dep and trailing comments that merely name the token — stay clean. It lives under
      # ci-fixtures/ (NOT crates/ or the workspace root), so the production detector never
      # scans it.
      - name: INV-4′ manifest-iroh self-test — must red on the renamed-dependency fixture
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        run: |
          set -uo pipefail
          hits=$(awk -f ci-fixtures/inv4-iroh-detector.awk ci-fixtures/inv4-iroh-rename-positive.toml 2>/dev/null) || true
          if [ -z "$hits" ]; then
            echo "::error::The manifest-side iroh detector is VACUOUS — it passed on ci-fixtures/inv4-iroh-rename-positive.toml, which holds the renamed-dependency evasion (a dep whose package is iroh, keyed under a different local name). The detector must catch this (QURATOR-281)."
            exit 1
          fi
          # Same allowlist test as the production step: every detected local name must be
          # allowlisted or the fixture has reds. The fixture holds only renames, so anything
          # detected here MUST be flagged.
          bad=""
          while IFS= read -r d; do
            [ -n "$d" ] || continue
            name=${d#*:}
            if [ "$name" != "iroh" ]; then bad="$bad$d"$'\n'; fi
          done <<< "$hits"
          if [ -z "$bad" ]; then
            echo "::error::The manifest-side iroh detector found declarations in the fixture but the allowlist test flagged none — the rename evasion walked past ALLOWED_IROH_NAMES (QURATOR-281)."
            exit 1
          fi
          # Every positive spelling must be among the flags: the plain [dependencies] rename,
          # the target-section rename (the section-awareness half of the awk), the dotted
          # [dependencies.NAME] section, the QUOTED dep key, the QUOTED section header, and
          # the SINGLE-QUOTED package value — the three spellings the detector once missed.
          for shape in ':quic$' ':quic-helper$' ':quic-section$' ':quic-q$' ':quic-dotted$' ':quic-lit$'; do
            if ! printf '%s' "$bad" | grep -qE "$shape"; then
              echo "::error::The manifest-side iroh detector missed the $shape local name — the renamed-dependency evasion is back (QURATOR-281)."
              exit 1
            fi
          done
          # The negatives must NOT be flagged: a benign dep, and trailing comments that
          # merely NAME the token — including one naming package = "iroh" itself. A red
          # here means comment-stripping broke and prose is feeding the detector.
          for neg in ':serde$' ':http-body$' ':something$'; do
            if printf '%s' "$bad" | grep -qE "$neg"; then
              echo "::error::The manifest-side iroh detector reds on the NEGATIVE $neg — a trailing comment naming iroh is not a dependency (comment-stripping regression, QURATOR-281)."
              exit 1
            fi
          done
          # Fixture hygiene: the fixture must demonstrate the RENAMING evasion specifically.
          # If it ever declares the dependency under the allowlisted literal key it is caught
          # trivially and pins nothing — same class as a control that passes because its own
          # message supplied the hit.
          if grep -qE '^[[:space:]]*iroh[[:space:]]*=' ci-fixtures/inv4-iroh-rename-positive.toml; then
            echo "::error::ci-fixtures/inv4-iroh-rename-positive.toml declares the dependency under the literal allowlisted key — it no longer demonstrates the renaming evasion this self-test exists to pin."
            exit 1
          fi
          echo "INV-4′ manifest-iroh self-test OK — every spelling reds the allowlist test, negatives clean:"
          printf '%s' "$bad" | sed 's/^/  /'

      # Positive control for the serde-derive probe inside the INV-4′ sweep above
      # (QURATOR-269, 2026-09-15 scan). The probe's comment claimed "Self-tested in the step
      # below" for months, but that step tested only the no-fs pattern — the awk had no
      # positive control at all, and the scan found it evadable three ways (cfg_attr wrapping,
      # indented derives, multi-line attributes). The fixture holds all three plus the shapes
      # the probe must keep catching and the one it must keep exempting; this step runs the
      # SAME awk against it and asserts it REDS. It lives under ci-fixtures/ (NOT crates/),
      # so the production probe never scans it.
      - name: Serde-derive probe self-test — must red on the positive fixture
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        run: |
          set -uo pipefail
          hits=$(awk '
            function hit() { printf "%s:%d:%s\n", FILENAME, NR, $0; bad = 1 }
            {
              if (open_attr) {
                if ($0 !~ /^[ \t]*(\/\/|\/\*|\*)/) { d_body = d_body " " $0; depth += gsub(/\(/, "("); depth -= gsub(/\)/, ")"); if (depth <= 0) open_attr = 0 }
                next
              }
              if ($0 ~ /^[ \t]*(\/\/|\/\*|\*)/) next
              if ($0 ~ /^[ \t]*#\[derive[ \t]*\(/) { d_body = d_body " " $0; depth = gsub(/\(/, "(") - gsub(/\)/, ")"); if (depth > 0) open_attr = 1; next }
              if ($0 ~ /^[ \t]*#\[cfg_attr[ \t]*\(/) { d_body = d_body " " $0; depth = gsub(/\(/, "(") - gsub(/\)/, ")"); if (depth > 0) open_attr = 1; next }
              if ($0 ~ /^[ \t]*#/) next
              if ($0 ~ /^[ \t]*(pub([ \t]*\([^)]*\))?[ \t]+)?(struct|enum|union)[ \t]+[A-Za-z_0-9]+/) {
                if (d_body != "") {
                  d = d_body; sub(/[ \t]*\/\/.*$/, "", d)
                  vis = ($0 ~ /^[ \t]*pub/) ? "pub" : "priv"
                  name = $0
                  sub(/^[ \t]*(pub([ \t]*\([^)]*\))?[ \t]+)?(struct|enum|union)[ \t]+/, "", name)
                  sub(/[^A-Za-z_0-9].*$/, "", name)
                  if (d ~ /Serialize/ || (d ~ /Deserialize/ && !(vis == "priv" && name == "WireEnvelope"))) hit()
                }
                d_body = ""
                next
              }
              if ($0 ~ /[^ \t]/) d_body = ""
            }
            END { exit(bad ? 0 : 1) }
          ' ci-fixtures/transport-payload-positive.rs 2>/dev/null) || true
          if [ -z "$hits" ]; then
            echo "::error::The serde-derive probe is VACUOUS — it passed on ci-fixtures/transport-payload-positive.rs, which holds the cfg_attr, indented and multi-line derive evasions (QURATOR-269) plus the plain Serialize and pub-Deserialize shapes."
            exit 1
          fi
          # Every planted shape must be named in the hit set — an awk edit that catches some
          # shapes and drops others must not pass silently.
          for shape in EvadesViaCfgAttr EvadesViaIndent EvadesViaMultilineCfgAttr PlainSerialize PubDeserialize; do
            if ! printf '%s\n' "$hits" | grep -q "$shape"; then
              echo "::error::The serde-derive probe missed the $shape case in ci-fixtures/transport-payload-positive.rs."
              exit 1
            fi
          done
          # Negative half: the private Deserialize-only WireEnvelope mirror is the one exempt
          # shape. If it appears here, the exemption is gone and every legitimate change to
          # the real transport_payload.rs reds the build.
          if printf '%s\n' "$hits" | grep -q WireEnvelope; then
            echo "::error::FALSE POSITIVE — the probe flagged the exempt WireEnvelope mirror."
            exit 1
          fi
          n=$(printf '%s\n' "$hits" | grep -c .)
          echo "Serde-derive probe self-test OK — caught $n derive(s), left the WireEnvelope mirror exempt:"
          printf '%s\n' "$hits" | sed 's/^/  /'

      # QURATOR-79 — Carrier 4's public-only fence rests on manifest_cache having exactly ONE
      # production writer (crates/hb-app/src/commands/browse.rs, inside accept_manifest_bytes). If a
      # private listing can never physically enter the cache, it can never be re-served from it — but
      # that claim was hand-verified once and nothing re-checked it since. The INV-4′ sweep above greps
      # for `priv_listing` references, not for new manifest_cache::put call sites, so a later feature
      # that writes private data to the cache would break the fence silently, with every test green.
      #
      # Two write forms exist, and a grep for only one of them is exactly the "hand-written list
      # cannot fix a hand-written list" trap: (a) any other file calling the qualified path
      # `manifest_cache::put(` (this also catches `crate::manifest_cache::put(`, a substring match),
      # and (b) manifest_cache.rs calling its OWN function unqualified — bare `put(` — which a
      # qualified-name-only grep misses entirely. The bare form is only probed for INSIDE
      # manifest_cache.rs itself: elsewhere an unrelated module's own `put(` would trip this
      # guard on a name collision, not a write.
      #
      # QURATOR-233 (2026-09-15 scan): IMPORTING is itself an evasion — `use
      # crate::manifest_cache::put;` followed by a bare `put(...)`, and a module alias `use
      # crate::manifest_cache as mc;` followed by `mc::put(...)`, spell neither
      # `manifest_cache::put(` nor a bare `put(` that this sweep may probe, so the qualified-only
      # pattern reported "exactly 1 production writer" while a second writer existed. The import
      # forms are therefore probed everywhere too: the use-line alternatives flag any import that
      # NAMES put (brace lists and `as`-renames included) or ALIASES the module itself. A plain
      # read-oriented module import (manifest_source.rs) and item imports not naming put
      # (fetch_driver.rs `CachedKey`) deliberately do not match. Self-tested against
      # ci-fixtures/manifest-writer-positive.rs in the step below.
      #
      # Scanned per-file, comment-stripped, and restricted to each file's own PRODUCTION region — the
      # lines before its first `#[cfg(test)]` marker (the whole file if it has none) — so the two
      # known test-only call sites (browse.rs:1246, store.rs:2002) are not flagged, and the function's
      # own `pub fn put(` declaration is excluded so a definition isn't miscounted as a call.
      #
      # The allowlist is a single file, verified to exist before anything else runs (an allowlist
      # naming a renamed/deleted file must fail loudly, not go silently green — same trap as the
      # INV-4′ TRANSPORT_FILES list above). The scan itself covers all of crates/hb-app/src (the
      # widest scope the defect could hide in, not just the two known files), prints a per-file count
      # so a clean result is distinguishable from a sweep that looked nowhere, and fails if it examined
      # zero files — a sweep that finds nothing because it found no files is the exact "wrong cwd /
      # absent tool" failure mode this repo has shipped before.
      - name: manifest-cache single-writer sweep — Carrier 4's public-only fence has exactly one writer
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          code_only() { grep -vE '^[^:]*:[0-9]+:[[:space:]]*(//|#|\*|/\*|<!--)'; }

          ALLOWED_FILE="crates/hb-app/src/commands/browse.rs"
          MC_FILE="crates/hb-app/src/manifest_cache.rs"

          if [ ! -f "$ALLOWED_FILE" ]; then
            echo "::error::manifest-cache single-writer sweep is stale — it allowlists $ALLOWED_FILE, which"
            echo "::error::does not exist. A renamed or deleted file silently shrinks this guard. Update it."
            exit 1
          fi

          files=$(find crates/hb-app/src -name '*.rs' | sort)
          nfiles=$(printf '%s\n' "$files" | grep -c .)
          if [ "$nfiles" -eq 0 ]; then
            echo "::error::manifest-cache single-writer sweep examined ZERO files under crates/hb-app/src —"
            echo "::error::wrong cwd or an absent tree reads as clean otherwise. Failing loudly instead."
            exit 1
          fi

          total_hits=0
          violations=""
          for f in $files; do
            # Production region = everything before this file's own #[cfg(test)] marker (or the whole
            # file if it has none). Test-only call sites are not the invariant this sweep guards.
            # `|| true`: a file with no `#[cfg(test)]` makes grep exit 1, and GitHub runs this step
          # under `-e -o pipefail`, so an unguarded no-match kills the sweep after the first such
          # file — silently, with no ::error:: and a green-looking "0 hits" for everything after it.
          boundary=$(grep -n '^#\[cfg(test)\]' "$f" | head -1 | cut -d: -f1 || true)
            boundary=${boundary:-999999}
            region=$(awk -v b="$boundary" -v fn="$f" 'NR<b {print fn":"NR":"$0}' "$f")
            nlines=$(printf '%s\n' "$region" | grep -c . || true); nlines=${nlines:-0}
            if [ "$f" = "$MC_FILE" ]; then
              pattern='manifest_cache::put[[:space:]]*\(|(^|[^a-zA-Z0-9_])put[[:space:]]*\('
            else
              # QURATOR-233: the second alternative catches the import-then-bare-call and
              # module-alias evasions on the use line itself (see the comment above).
              pattern='manifest_cache::put[[:space:]]*\(|(^|[^a-zA-Z0-9_])use[[:space:]][^;]*manifest_cache([^;]*[^a-zA-Z0-9_]put([^a-zA-Z0-9_]|$)|[[:space:]]+as[[:space:]])'
            fi
            hits=$(printf '%s\n' "$region" | grep -E "$pattern" 2>/dev/null | code_only | grep -vE ':[[:space:]]*(pub[[:space:]]+)?fn[[:space:]]+put[[:space:]]*\(' || true)
            n=$(printf '%s\n' "$hits" | grep -c . || true)
            printf '%s: %d production manifest_cache::put site(s) (%d lines examined pre-cfg(test))\n' "$f" "$n" "$nlines"
            if [ "$n" -gt 0 ]; then
              total_hits=$((total_hits + n))
              if [ "$f" != "$ALLOWED_FILE" ]; then
                violations="$violations"$'\n'"$hits"
              fi
            fi
          done

          if [ -n "$violations" ]; then
            echo "::error::manifest-cache single-writer regression — a production write to manifest_cache::put appeared outside $ALLOWED_FILE (the only site Carrier 4's public-only fence assumes):"
            echo "$violations"
            fail=1
          fi

          if [ "$total_hits" -ne 1 ]; then
            echo "::error::manifest-cache single-writer regression — expected exactly 1 production manifest_cache::put call site (at $ALLOWED_FILE), found $total_hits."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::the manifest cache single-writer invariant is what Carrier 4's public-only fence rests on — a private listing cannot re-enter the cache if nothing new can write to it."
            exit 1
          fi
          echo "manifest-cache single-writer sweep clean — examined $nfiles file(s), exactly 1 production writer, at $ALLOWED_FILE."

      # Positive control for the import-evasion half of the manifest-cache single-writer
      # sweep above (QURATOR-233, 2026-09-15 scan). The fixture holds both import forms that
      # spell neither the qualified call nor a probe-able bare put( — the item import plus
      # bare call, and the module alias — plus the plain read-oriented module import that
      # must stay exempt. This step runs the SAME pattern-and-filter pipeline against it and
      # asserts both evasions RED and the read import does not. It lives under ci-fixtures/
      # (NOT crates/hb-app/src), so the production sweep never scans it.
      - name: Manifest-cache import-evasion self-test — must red on the positive fixture
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        run: |
          set -uo pipefail
          code_only() { grep -vE '^[^:]*:[0-9]+:[[:space:]]*(//|#|\*|/\*|<!--)'; }
          # The exact non-manifest_cache.rs branch pattern from the sweep above.
          pattern='manifest_cache::put[[:space:]]*\(|(^|[^a-zA-Z0-9_])use[[:space:]][^;]*manifest_cache([^;]*[^a-zA-Z0-9_]put([^a-zA-Z0-9_]|$)|[[:space:]]+as[[:space:]])'
          # -H is load-bearing exactly as in the sweep above: code_only anchors on the
          # file:line: prefix, which a single-file grep omits without it.
          hits=$(grep -HnE "$pattern" ci-fixtures/manifest-writer-positive.rs 2>/dev/null | code_only) || true
          if [ -z "$hits" ]; then
            echo "::error::The manifest-cache single-writer sweep is VACUOUS against imports — it passed on ci-fixtures/manifest-writer-positive.rs, which holds the import-then-bare-call and module-alias evasions (QURATOR-233)."
            exit 1
          fi
          for evasion in 'manifest_cache::put;' 'manifest_cache as mc'; do
            if ! printf '%s\n' "$hits" | grep -qF "$evasion"; then
              echo "::error::The manifest-cache sweep missed the '$evasion' import form in ci-fixtures/manifest-writer-positive.rs (QURATOR-233)."
              exit 1
            fi
          done
          # Negative half: the plain module import is the read-oriented form production code
          # uses today (manifest_source.rs). Flagging it would red the build on the current tree.
          if printf '%s\n' "$hits" | grep -qE 'use crate::manifest_cache;$'; then
            echo "::error::FALSE POSITIVE — the sweep flagged a plain read-oriented module import, which manifest_source.rs uses today."
            exit 1
          fi
          n=$(printf '%s\n' "$hits" | grep -c .)
          echo "Manifest-cache import-evasion self-test OK — caught $n import evasion(s), exempted the read-oriented module import:"
          printf '%s\n' "$hits" | sed 's/^/  /'

      # M18 W5 — the retired MASCARA-COURIER framing must not creep back into code.
      #
      # Mascara is a separate Buddy Backup/Sync platform (2026-07-26 ruling). It is NOT Hoardbook's
      # courier, does not ticket files for it, and is not where "transfer lives". Every sentence in
      # this repo that said otherwise was false the day the ruling landed.
      #
      # **This probe exists because the cleanup list was wrong three times running, each time in the
      # same way — it named a layer and missed the ones below it:**
      #   · 2026-07-26 listed only SPEC surfaces and missed every code site;
      #   · 2026-07-30 listed 6 hb-app sites and missed hb-core, hb-net and hb-it entirely;
      #   · both missed the FRONTEND, where the damage was worst — a shipped Home toast literally read
      #     "Manifest exported — send it with Mascara", and the `no-download` tooltip pointed users at
      #     "the Mascara companion" as a transfer route.
      # A hand-written list of sites cannot fix a hand-written list of sites. So the allowlist is
      # inverted: it enumerates the mentions that are ALLOWED to survive, and anything else fails.
      # This is INVARIANT_AUDIT §6b applied properly — an unrecorded legitimate exception fails
      # exactly like an unrecorded violation, so the legitimate ones are recorded.
      #
      # The six survivors are all history or tombstones: they say the courier role is DEAD. That is
      # the only sense in which the word may appear.
      - name: Mascara-courier framing stays retired
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        run: |
          set -uo pipefail
          # path:count — every file allowed to mention Mascara, and how many OCCURRENCES.
          # Occurrences, not matching LINES: `grep -c` counts lines, so a second mention appended
          # to an existing line would not move the number and would sail straight through.
          # (`chat.rs` is the live example — 2 matching lines, 3 mentions.)
          # chat.rs 3 -> 6 (QURATOR-79, 2026-09-01): `request_manifest_from` passes no
          # `mascara_pubkey`, and both its doc comment and its test say why — "Mascara is not a
          # Hoardbook courier; a re-serve ask has no Mascara fallback to name". Tombstones that
          # DENY the courier role, which is the bump case this guard describes, not the delete one.
          ALLOWED="crates/hb-app/src/identity_state.rs:1
          crates/hb-app/src/commands/chat.rs:6
          crates/hb-core/src/ticket.rs:1
          crates/hb-app/ui/src/lib/request-inbox.ts:1"
          fail=0
          # Scans every TRACKED file, not just the two src roots. Scanning `crates/*/src` +
          # `crates/hb-app/ui/src` left `build.rs`, the Cargo manifests, the vite/svelte configs and
          # anything under `crates/*/tests/` unwatched — a mention there would have stayed green,
          # which is the same "the list named a layer and missed the ones under it" failure this
          # probe exists to end. `git grep` also means a new top-level directory is covered the day
          # it appears, with no list to update.
          #
          # One deliberate, documented exclusion: this workflow file itself. A guard has to name the
          # thing it forbids. (Same reasoning as excluding `mas-inv5-no-download.test.ts` from the
          # filename probe above — a probe that flags its own guard is broken.)
          actual=$(git grep -lI 'Mascara' -- . ':!.github/workflows/ci.yml' | sort -u)
          expected=$(printf '%s\n' "$ALLOWED" | sed 's/^ *//; s/:[0-9]*$//' | sort -u)
          if newcomers=$(comm -23 <(echo "$actual") <(echo "$expected")) && [ -n "$newcomers" ]; then
            echo "::error::The retired Mascara-courier framing appeared in files that are not allowed to mention it:"
            echo "$newcomers"
            echo "::error::Mascara is a separate Buddy Backup/Sync platform, NOT Hoardbook's courier."
            fail=1
          fi
          # Counts are checked too: a NEW sentence in an already-listed file is exactly how this crept
          # back the first time, and a file-level allowlist would wave it through.
          printf '%s\n' "$ALLOWED" | sed 's/^ *//' | while IFS=: read -r f want; do
            [ -n "$f" ] || continue
            if [ ! -f "$f" ]; then
              echo "::error::Mascara allowlist is stale — it lists $f, which does not exist. A renamed or"
              echo "::error::deleted file silently shrinks this guard. Update the list."
              exit 1
            fi
            got=$(grep -oI 'Mascara' "$f" | wc -l | tr -d ' ')
            if [ "$got" != "$want" ]; then
              echo "::error::$f mentions Mascara $got time(s), allowlist says $want."
              echo "::error::If the new mention says the courier role is DEAD, bump the count. If it revives it, delete it."
              exit 1
            fi
          done || fail=1
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "Mascara-courier framing clean — every surviving mention is a tombstone."
          # M14: Skeleton/Tailwind were de-vendored (the UI is hand-rolled oklch + scoped CSS) — a
          # CSS framework creeping back in is scope creep, not a feature.
          if out=$(grep -rnE '@skeletonlabs|tailwind' crates/hb-app/ui/src crates/hb-app/ui/package.json 2>/dev/null); then
            echo "::error::a CSS framework crept back in:"; echo "$out"; exit 1
          fi
          echo "CSS-framework sweep clean — no Skeleton/Tailwind in ui/src or package.json."
          # DISC3/INV-2: the discovery surface is structurally browse-key-free (audit I-5).
          if out=$(grep -rnE 'browse_key|BrowseKey' crates/hb-net/src/discover.rs 2>/dev/null); then
            echo "::error::INV-2 regression — the browse-key reached the discovery surface:"; echo "$out"; exit 1
          fi
          echo "DISC3/INV-2 probe clean — discover.rs is browse-key-free."
          # Tracked-files guard (audit I-9b): internal planning docs are gitignored (code-only
          # commits); a tracked one is a leak, not a doc.
          if tracked=$(git ls-files | grep -E '^(HOARDBOOK_SPEC|MASCARA_SPEC|PROMPT|HANDOVER|TEST_PLAN|REGRESSION|RELAY_DEPLOY|PROCESS_ENGINEERING|SEEDING|INVARIANT_AUDIT|SEMANTICS|MILESTONE1|CLAUDE)\.md$|^planning/'); then
            echo "::error::internal doc tracked in git — planning docs are gitignored; a tracked one is a leak, not a doc:"; echo "$tracked"; exit 1
          fi
          echo "Tracked-files guard clean — no internal docs in the git index."

      # CWE-94 injection guard for workflow files. A git tag name (github.ref_name), a PR branch
      # name (github.head_ref), or a PR title/body (github.event.*) is attacker-controllable, and
      # splicing it into a `run:`/`script:` body with `${{ ... }}` lets the attacker run arbitrary
      # code in the job — in release.yml that job holds TAURI_SIGNING_PRIVATE_KEY, so this chains
      # to signing-key theft and fleet-wide RCE. The fix is indirection: interpolate into an `env:`
      # block (or read the auto-populated GITHUB_REF_NAME) so the value never becomes script text.
      # This sweep fails the build if any of those contexts is interpolated INLINE in a script body.
      # The legitimate fix interpolates them as a YAML scalar value (`key: ${{ ... }}` under env:/
      # with:), which is safe — the value enters the runner environment, never a shell parser.
      # QURATOR-223 (2026-09-15 scan) fixed two false negatives in how "script body" and
      # "attacker context" were recognised:
      #   · the context set now includes github.event.pull_request.head.ref/.head.label — the
      #     fork branch name under its other spelling, which the retired alternation never
      #     matched even for a direct inline interpolation;
      #   · the retired line-regex exempted anything shaped `key: value` — but INSIDE a run:
      #     body that shape is live shell text once GitHub splices the value in (`label:`
      #     fails as a command, then the injected title's `;` executes). A line regex cannot
      #     see YAML structure, so the sweep is now a small awk state machine that tracks
      #     run:/script: block scalars and flags attacker-context interpolation ONLY inside
      #     script bodies — exactly the decision this step has always documented. Genuine
      #     env:/with: slots are mapping lines OUTSIDE any run:/script: block, so they are
      #     safe by structure, not by exemption. github.repository is owner-controlled and
      #     never attacker-controllable, so it is not in the pattern. Ubuntu-only, like the
      #     guards above; one pass over every workflow file suffices.
      # QURATOR-282 (2026-09-16 scan) fixed two more false negatives:
      #   · the context set now also includes the other classic fork-PR injection sources —
      #     commit messages (github.event.commits[*].message and head_commit.message, caught
      #     by the message arm of the event alternation), workflow_run.head_branch (the
      #     re-run branch, which a fork PR controls), and release.name — none of which the
      #     retired title|body alternation matched even inline;
      #   · the retired needle's gap between the dollar-double-brace and github. was `[^}]*`,
      #     which cannot cross a `}` — so format-wrapped interpolation, with a single `}`
      #     inside format('{0}', ...), never reached the context and escaped inline detection.
      #     The gap is now `([^}]|}[^}])*`: it steps over a lone `}` but never over the `}}`
      #     that TERMINATES an interpolation, so prose after a closed safe expression still
      #     cannot be dragged into a match.
      - name: Workflow injection sweep — no attacker-context interpolation in script bodies
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        run: |
          set -uo pipefail
          # NOTE: the comments and awk source below must never contain a literal
          # dollar-double-brace — GitHub interpolates `run:` bodies (comments included) at
          # startup, so a literal one fails the whole workflow. Every regex below writes the
          # bracket-class form, which cannot form that sequence.
          files=$(find .github/workflows -type f | sort)
          nfiles=$(printf '%s\n' "$files" | grep -c .)
          if [ "$nfiles" -eq 0 ]; then
            echo "::error::workflow injection sweep examined ZERO files under .github/workflows —"
            echo "::error::wrong cwd or an absent tree reads as clean otherwise. Failing loudly instead."
            exit 1
          fi
          # The state machine: a run:/script: key line is checked inline; a block-scalar
          # indicator (| or >) on such a line opens a body that stays open until a nonblank
          # line dedents to or past the opener. Interpolations are flagged only inside those
          # bodies — mapping lines (env:/with: slots) are outside them and safe by structure.
          if out=$(awk '
            BEGIN { att = "[$][{][{]([^}]|}[^}])*github[.](ref_name|head_ref|event[.][^}]*(title|body|message)|event[.]pull_request[.]head[.](ref|label)|event[.]workflow_run[.]head_branch|event[.]release[.]name)" }
            FNR == 1 { inblock = 0; keyindent = -1 }
            {
              line = $0
              # Leading-space count (YAML forbids tabs for indentation); an all-blank line
              # stays "deep" so empty lines never close a block.
              n = match(line, /[^ ]/)
              ind = (n == 0) ? 999999 : n - 1
              if (inblock) {
                if (ind > keyindent) {
                  if (match(line, att)) { printf "%s:%d:%s\n", FILENAME, FNR, line; bad = 1 }
                  next
                }
                inblock = 0   # dedented to/past the opener: back to mapping context
              }
              if (line ~ /^[ ]*(-[ ]+)?(run|script):/) {
                if (match(line, att)) { printf "%s:%d:%s\n", FILENAME, FNR, line; bad = 1 }
                if (line ~ /:[ ]*[|>]/) { inblock = 1; keyindent = ind }
              }
            }
            END { exit(bad ? 0 : 1) }
          ' $files 2>/dev/null); then
            echo "::error::CWE-94 regression — an attacker-controllable context is interpolated inline in a workflow script body:"
            echo "$out"
            echo "::error::Route it through an env: block (or GITHUB_REF_NAME) as a YAML value, never inline as script text."
            exit 1
          fi
          for f in $files; do printf 'workflow injection sweep examined %s (%s lines)\n' "$f" "$(wc -l < "$f")"; done
          echo "Workflow injection sweep clean — no attacker-context interpolation inside any run:/script: body ($nfiles file(s))."

      # Positive control for the guard above (QURATOR-48). The guard is a security gate, so it
      # must have a test proving it is not vacuous: a fixture file holds deliberately-dangerous
      # run:/script: interpolations of attacker-controllable contexts, and this step runs the
      # SAME grep logic against it and asserts it REDS. If the guard ever silently passes on
      # the fixture, the gate is broken and this step fails the build. The fixture lives under
      # ci-fixtures/ (NOT .github/workflows/) so GitHub does not parse it as a workflow; the
      # production sweep above scans only .github/workflows, so the fixture never trips it.
      - name: Injection-sweep guard self-test — must red on the positive fixture
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        run: |
          set -uo pipefail
          # This step runs the SAME awk state machine as the guard above against a positive
          # fixture and asserts it REDS, proving the guard is not vacuous. The awk prints
          # FILENAME itself, single file or not, so the retired -H single-file prefix drift
          # cannot recur here. The awk source uses the bracket-class form so no literal
          # dollar-double-brace ever appears in this run: body.
          hits=$(awk '
            BEGIN { att = "[$][{][{]([^}]|}[^}])*github[.](ref_name|head_ref|event[.][^}]*(title|body|message)|event[.]pull_request[.]head[.](ref|label)|event[.]workflow_run[.]head_branch|event[.]release[.]name)" }
            FNR == 1 { inblock = 0; keyindent = -1 }
            {
              line = $0
              n = match(line, /[^ ]/)
              ind = (n == 0) ? 999999 : n - 1
              if (inblock) {
                if (ind > keyindent) {
                  if (match(line, att)) { printf "%s:%d:%s\n", FILENAME, FNR, line; bad = 1 }
                  next
                }
                inblock = 0
              }
              if (line ~ /^[ ]*(-[ ]+)?(run|script):/) {
                if (match(line, att)) { printf "%s:%d:%s\n", FILENAME, FNR, line; bad = 1 }
                if (line ~ /:[ ]*[|>]/) { inblock = 1; keyindent = ind }
              }
            }
            END { exit(bad ? 0 : 1) }
          ' ci-fixtures/injection-positive.yml 2>/dev/null) || true
          if [ -z "$hits" ]; then
            echo "::error::The injection-sweep guard is VACUOUS — it passed on ci-fixtures/injection-positive.yml, which holds deliberately-dangerous run:/script: interpolations. The guard must catch these (QURATOR-48, QURATOR-223)."
            exit 1
          fi
          n=$(printf '%s\n' "$hits" | grep -c .)
          # Negative half: the fixture also holds SAFE env: keys whose names merely start with a
          # script-bearing name (run_id, scripts_dir, RUNNER_TAG). Those are mapping lines
          # OUTSIDE any run:/script: block, so the structural scope must leave them alone. If
          # they show up in the hit set, the block tracking has lost its anchor and every
          # workflow using such a key would red the build on a false positive.
          if fp=$(printf '%s\n' "$hits" | grep -E 'run_id:|scripts_dir:|RUNNER_TAG:'); then
            echo "::error::FALSE POSITIVE — the guard flagged a safe env: key. The awk must scope hits to run:/script: bodies only; mapping lines are safe by structure."
            echo "$fp"
            exit 1
          fi
          # And the two QURATOR-223 evasions must be among the hits, not just the old shapes.
          for shape in 'pull_request.head.ref' 'pull_request.head.label'; do
            if ! printf '%s\n' "$hits" | grep -q "$shape"; then
              echo "::error::The injection-sweep guard missed the $shape context — the QURATOR-223 alternation gap is back."
              exit 1
            fi
          done
          # And the four QURATOR-282 contexts must be too. -F (fixed-string) is load-bearing
          # here: the commits shape carries literal brackets, which a pattern grep would read
          # as its own bracket expression and match nothing.
          for shape in 'commits[0].message' 'head_commit.message' 'workflow_run.head_branch' 'release.name'; do
            if ! printf '%s\n' "$hits" | grep -qF "$shape"; then
              echo "::error::The injection-sweep guard missed the $shape context — the QURATOR-282 alternation gap is back."
              exit 1
            fi
          done
          # The format()-wrapped form must be caught as a HIT, not merely present in the
          # fixture: the retired needle's gap could not cross the lone right-brace inside
          # format('{0}', ...), so this exact expression escaped inline detection. Pinning the
          # full inner expression proves the widened gap stepped over that brace.
          if ! printf '%s\n' "$hits" | grep -qF "format('{0}', github.head_ref)"; then
            echo "::error::The injection-sweep guard missed the format-wrapped interpolation — the QURATOR-282 needle-gap evasion is back."
            exit 1
          fi
          if ! printf '%s\n' "$hits" | grep -qE '^[^:]+:[0-9]+:[[:space:]]+label: '; then
            echo "::error::The injection-sweep guard missed the label-prefixed line inside a run: body — the QURATOR-223 colon-lookalike exemption is back."
            exit 1
          fi
          echo "Guard self-test OK — caught $n dangerous interpolation(s), exempted every safe env: key, and caught both QURATOR-223 shapes:"
          printf '%s\n' "$hits" | sed 's/^/  /'

      # release.yml overwrites both versions from the tag at build time; this pins dev-build
      # getVersion() honesty (audit I-8): tauri.conf.json must match the hb-app package version.
      - name: Version consistency — tauri.conf.json matches Cargo.toml
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, sys
          cargo = open('crates/hb-app/Cargo.toml').read()
          m = re.search(r'\[package\][^\[]*?\nversion\s*=\s*"([^"]+)"', cargo, flags=re.S)
          if not m:
              sys.exit('::error::no version found in crates/hb-app/Cargo.toml [package]')
          cargo_v = m.group(1)
          with open('crates/hb-app/tauri.conf.json') as f:
              tauri_v = json.load(f)['version']
          if cargo_v != tauri_v:
              sys.exit(f'::error::version drift (audit I-8) — Cargo.toml={cargo_v} vs tauri.conf.json={tauri_v}')
          print(f'versions in sync: {cargo_v}')
          PY

      # Clippy debt burned down 2026-07-03 (audit I-7) — clippy is now a blocking gate.
      - name: cargo clippy --workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

  # L2 — the appraisal-requested "integration in CI" leg, now possible because Nostr relays are
  # off-the-shelf and ephemeral. Spins TWO strfry relays (so the multi-relay cases DM4/ID4/AB8
  # actually run) using the vendored crates/hb-it/strfry.conf, then drives hb-net's client via
  # hb-it. Ubuntu-only (the relay is Linux/Docker); needs no frontend (hb-it doesn't touch hb-app).
  integration:
    name: integration (L2 — ephemeral Nostr relay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QURATOR-111 #16: SHA-pinned (was @stable, a moving branch). Resolved via
      # gh api repos/dtolnay/rust-toolchain/commits/stable. The action's `toolchain`
      # input still defaults to `stable`, so this pin does not freeze the Rust version.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable (branch head 2026-08-05)

      # QURATOR-111 #16: SHA-pinned (was @v2). Resolved via gh api
      # repos/Swatinem/rust-cache/commits/v2.9.2 — the v2 branch head == the v2.9.2 tag.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      # GitHub `services:` containers start before checkout, so the vendored strfry.conf can't be
      # volume-mounted into one — start strfry in a run: step after checkout instead (QURATOR-111
      # #30, 2026-08-23 scan): the image ref is pinned by digest — was the floating :latest,
      # resolved at run time by a third party on every PR. Digest is the manifest-LIST digest
      # (amd64 + arm64), resolved 2026-08-25 via `docker manifest inspect dockurr/strfry:latest`
      # and cross-confirmed against the registry's Docker-Content-Digest header. Upgrades are
      # now a deliberate digest bump, not whatever the registry serves that day.
      - name: Start two ephemeral strfry relays
        run: |
          docker run -d --name relay1 -p 7777:7777 \
            -v "$PWD/crates/hb-it/strfry.conf:/etc/strfry.conf:ro" \
            -v strfrydb1:/app/strfry-db dockurr/strfry@sha256:7ae77f50cc0cf5dab53a50c2790681dfaa40d7d6df3e0d77df6bf0a84fff58bd  # was :latest, 2026-07-21 build
          docker run -d --name relay2 -p 7778:7777 \
            -v "$PWD/crates/hb-it/strfry.conf:/etc/strfry.conf:ro" \
            -v strfrydb2:/app/strfry-db dockurr/strfry@sha256:7ae77f50cc0cf5dab53a50c2790681dfaa40d7d6df3e0d77df6bf0a84fff58bd  # was :latest, 2026-07-21 build

      # QURATOR-196 collateral: the relays are addressed by HOSTNAME, not 127.0.0.1, and this is
      # load-bearing for BR4. That case is the NIP-65 outbox model — the peer advertises relay2 as
      # their outbox and publishes their listing ONLY there, while the browser starts connected to
      # relay1 only. QURATOR-196 (rightly) stopped browse from pooling a peer-advertised relay and
      # now reads it through a scoped ephemeral client, but only after `validate_relay_url`, which
      # rejects loopback as SSRF. So a peer-advertised `ws://127.0.0.1:7778` is dropped, no scoped
      # client is built, and BR4 fails with "browse did not reach the peer's outbox relay" — which
      # is exactly what happened on `29265975`, whose own doc comment assumed the harness relay was
      # always a pool member (in BR4 it deliberately is not). `validate_relay_url` matches literal
      # names and IP strings and does NO DNS resolution (deliberate — see its doc comment), so a
      # hostname passes the guard while the guard itself stays byte-identical and still runs. This
      # keeps CI hermetic (no third-party relays, no secrets, no events on strangers' infra) and
      # keeps BR4 exercising the real production path. Do NOT "simplify" these back to 127.0.0.1.
      - name: Alias the relay hostnames to loopback
        run: echo '127.0.0.1 hb-relay1.test hb-relay2.test' | sudo tee -a /etc/hosts

      - name: Wait for the relays to accept connections
        run: |
          for port in 7777 7778; do
            name=$([ "$port" = 7777 ] && echo relay1 || echo relay2)
            ok=
            for i in $(seq 1 60); do
              # Fail fast (with logs) if the container crashed instead of silently waiting 60s.
              if [ "$(docker inspect -f '{{.State.Running}}' "$name" 2>/dev/null)" != "true" ]; then
                echo "::error::$name exited before binding its port"; docker logs "$name" || true; exit 1
              fi
              if (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null; then
                echo "$name on $port is up (after ${i}s)"; ok=1; break
              fi
              sleep 1
            done
            if [ -z "$ok" ]; then
              echo "::error::$name on $port never accepted a connection within 60s"; docker logs "$name" || true; exit 1
            fi
          done
          # Protocol-level readiness: the relay answers its NIP-11 relay-information document.
          for i in $(seq 1 15); do
            if curl -fsS -H 'Accept: application/nostr+json' http://127.0.0.1:7777 >/dev/null 2>&1; then
              echo "NIP-11 document served — relays ready"; break
            fi
            sleep 1
          done

      - name: Run the L2 integration suite (hb-it) — incl. Suite COUNT + Suite CANARY (M9)
        run: cargo run -p hb-it --locked -- --relay ws://hb-relay1.test:7777 --relay ws://hb-relay2.test:7778 --pow 8

      # M9 Track K: exercise the canary CLI end-to-end (the systemd oneshot form). A green backbone
      # must exit 0; a deliberately-broken relay must exit nonzero (the alarm fires). The two relays
      # simulate SG↔JP for the cross-region step.
      - name: Canary CLI — green backbone exits 0
        run: cargo run -p hb-it --locked -- --canary --relay ws://hb-relay1.test:7777 --relay ws://hb-relay2.test:7778

      - name: Canary CLI — broken relay exits nonzero (alarm fires)
        run: |
          if cargo run -p hb-it --locked -- --canary --relay ws://127.0.0.1:1; then
            echo "::error::canary exited 0 against a broken relay — the alarm did not fire"; exit 1
          else
            echo "canary correctly exited nonzero against a broken relay"
          fi

      - name: Relay logs (on failure)
        if: failure()
        run: docker logs relay1 && docker logs relay2

  frontend:
    name: frontend checks (svelte-check + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      # QURATOR-255: no dependency lifecycle scripts on fork-PR trees (see the test job's
      # frontend build step for the full rationale); esbuild is the one script-carrying dep
      # these runners install, so it alone is rebuilt with its scripts.
      - name: Install frontend dependencies
        working-directory: crates/hb-app/ui
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild

      # svelte-check is the build-level guard for the content_types contract:
      # reading a nonexistent singular `content_type` is a strict-mode type error.
      - name: svelte-check
        working-directory: crates/hb-app/ui
        run: npm run check

      - name: vitest
        working-directory: crates/hb-app/ui
        run: npm test

  # L4 — the profiling gate (M9, Decision #18). Ubuntu-only, like frontend. Two cheap surfaces (no
  # webkit/frontend build needed): (a) the frontend recursive-tree profiler over M9's standalone
  # 2000-node fixture, compared to the checked-in perf-budgets.json (fails on a regression beyond
  # tolerance); (b) the F2 count-tally wall-clock budget (hb-core, no frontend dep). The Rust
  # background-loop idle guard (presence + watch loops idle; the spinning fixture must fail) runs in
  # the main `test` matrix as part of `cargo test --workspace`, so it isn't duplicated here.
  profiling:
    name: profiling (L4 — perf budgets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      # QURATOR-111 #16: SHA-pinned (was @stable, a moving branch). Resolved via
      # gh api repos/dtolnay/rust-toolchain/commits/stable. The action's `toolchain`
      # input still defaults to `stable`, so this pin does not freeze the Rust version.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable (branch head 2026-08-05)

      # QURATOR-111 #16: SHA-pinned (was @v2). Resolved via gh api
      # repos/Swatinem/rust-cache/commits/v2.9.2 — the v2 branch head == the v2.9.2 tag.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      # QURATOR-255: no dependency lifecycle scripts on fork-PR trees (see the test job's
      # frontend build step for the full rationale); esbuild is the one script-carrying dep
      # these runners install, so it alone is rebuilt with its scripts.
      - name: Install frontend dependencies
        working-directory: crates/hb-app/ui
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild

      - name: Frontend L4 profiler + budget gate
        working-directory: crates/hb-app/ui
        run: npm run profile

      - name: Upload profiling report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profiling-report
          path: crates/hb-app/ui/profiling-report.json
          if-no-files-found: ignore

      # F2 — the count tally must complete under its wall-clock budget (hb-core only, no frontend).
      - name: F2 count-tally wall-clock budget
        run: cargo test -p hb-core --locked count_tally_over_500_events_is_under_budget_f2

  # Supply-chain scanners — added by audit I-4. Policy lives in deny.toml.
  #
  # `cargo audit` is BLOCKING as of QURATOR-128 step 4 (2026-09-11): the nostr 0.44.8 bump cleared
  # every RustSec vulnerability, so a red here is a NEW advisory, not the accepted baseline.
  #
  # `cargo deny` and `npm audit` remain NON-BLOCKING (continue-on-error). cargo deny errors on
  # `unmaintained` for nine crates (nostr-relay-pool RUSTSEC-2026-0243, instant, paste,
  # proc-macro-error, unic-char-property, unic-char-range, unic-common, unic-ucd-ident,
  # unic-ucd-version) — none has a patched release, and the owner ruled an allowlist out. Flip it
  # when those move upstream. A green tick on those two steps means "the scanner ran", not
  # "it passed" — read the raw log.
  supply-chain:
    name: supply chain (cargo-audit + cargo-deny + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QURATOR-111 #16: SHA-pinned (was @stable, a moving branch). Resolved via
      # gh api repos/dtolnay/rust-toolchain/commits/stable. The action's `toolchain`
      # input still defaults to `stable`, so this pin does not freeze the Rust version.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable (branch head 2026-08-05)

      # QURATOR-111 #16: SHA-pinned (was @v2). Resolved via gh api
      # repos/taiki-e/install-action/commits/v2.86.7 — the v2 branch head == the v2.86.7 tag.
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc  # v2.86.7
        with:
          tool: cargo-audit,cargo-deny

      - name: cargo audit (RustSec advisories over Cargo.lock)
        run: cargo audit

      - name: cargo deny (advisories + bans + sources)
        continue-on-error: true
        run: cargo deny check advisories bans sources

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: npm audit (frontend, high and above)
        continue-on-error: true
        working-directory: crates/hb-app/ui
        run: |
          # QURATOR-255: npm audit executes no package code, so scripts stay disabled here.
          npm ci --ignore-scripts
          npm audit --audit-level=high
