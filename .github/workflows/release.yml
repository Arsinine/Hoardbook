name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: create
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ github.ref_name }}
        with:
          script: |
            const tag = process.env.TAG;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Hoardbook ${tag}`,
              body: 'See the assets below to download this version.',
              draft: true,
            });
            return data.id;

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # QURATOR-225: the default persist-credentials: true leaves the
          # contents:write job token in .git/config, readable by every later
          # dependency-executing step (npm lifecycle scripts, cargo build.rs).
          # No later step uses git-protocol auth — release uploads go through
          # the GITHUB_TOKEN env of the steps that need it — so nothing is
          # lost by not persisting.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head, 2026-08-05

      - name: Verify updater signing secret is set
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY repo secret is not set."
            echo "::error::Without it the post-build signing step below fails and the in-app"
            echo "::error::updater fails with 'Could not fetch a valid release JSON from the remote'."
            echo "::error::Generate a key with 'cargo tauri signer generate' and add it to"
            echo "::error::repo Settings → Secrets → Actions as TAURI_SIGNING_PRIVATE_KEY."
            exit 1
          fi

      - name: Sync app version with git tag
        shell: bash
        run: |
          # Tag is like 'v0.2.5'; strip the leading 'v'.
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          echo "Bumping app version → $version"
          # Cargo.toml: replace only the package version, not dependency versions.
          # The package block's first 'version = "..."' line is what we target.
          python3 - "$version" <<'PY'
          import re, sys
          v = sys.argv[1]
          path = 'crates/hb-app/Cargo.toml'
          with open(path) as f: src = f.read()
          # Replace the first version assignment in the [package] section.
          new = re.sub(
              r'(\[package\][^\[]*?\nversion\s*=\s*)"[^"]+"',
              r'\1"' + v + '"',
              src,
              count=1,
              flags=re.S,
          )
          # Idempotent: the source version may already equal the tag (we now keep
          # them in sync), so don't require a change — just verify the [package]
          # version is now exactly `v`.
          assert re.search(
              r'\[package\][^\[]*?\nversion\s*=\s*"' + re.escape(v) + r'"',
              new,
              flags=re.S,
          ), f"failed to set version {v} in {path}"
          with open(path, 'w') as f: f.write(new)
          PY
          # tauri.conf.json: top-level "version".
          python3 - "$version" <<'PY'
          import json, sys
          v = sys.argv[1]
          path = 'crates/hb-app/tauri.conf.json'
          with open(path) as f: cfg = json.load(f)
          cfg['version'] = v
          with open(path, 'w') as f: json.dump(cfg, f, indent=2)
          PY
          # Also refresh Cargo.lock so the tauri build doesn't fail with --locked.
          cargo update -p hb-app --precise "$version" || true

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: crates/hb-app/ui
        # QURATOR-221: lockfile-strict install, matching ci.yml. `npm install` would
        # silently re-resolve drifted package.json ranges from the registry at
        # release time, embedding unreviewed dependency code in the signed build.
        run: npm ci

      # QURATOR-220: the updater signing key no longer rides this step. tauri build
      # compiles and runs the whole Cargo/npm dependency tree (every build.rs, the
      # beforeBuildCommand chain), so TAURI_SIGNING_PRIVATE_KEY here hands the fleet
      # trust root to any one compromised dependency. The bundle is now built and
      # uploaded unsigned; the post-build step below signs the updater artifacts
      # with the integrity-pinned CLI — the shape QURATOR-107 established for the
      # portable exe.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release-id }}
          projectPath: crates/hb-app
          args: ${{ matrix.args }}

      - name: Sign + publish the bundle updater artifacts (post-build)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # QURATOR-220: with the key gone from the build step's env, tauri-action
          # uploads the bundles unsigned and skips latest.json. This step re-adds
          # both, using the same hardening the portable step below established
          # (QURATOR-107): the signer CLI comes from an integrity-pinned lockfile
          # (`npm ci` refuses any tarball whose sha512 differs), the key travels
          # env → temp file → --private-key-path and is unset before invoking (the
          # CLI rejects the flag while the env var is set), the password is read
          # from its own env var, never argv, and the temp key file is removed by
          # trap even when signing fails. The only dependency code this step
          # executes is that pinned CLI.
          version="${GITHUB_REF_NAME#v}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            artifacts=("target/release/bundle/nsis/Hoardbook_${version}_x64-setup.exe")
          else
            artifacts=("target/release/bundle/appimage/Hoardbook_${version}_amd64.AppImage"
              "target/release/bundle/deb/Hoardbook_${version}_amd64.deb")
          fi
          for a in "${artifacts[@]}"; do
            if [ ! -f "$a" ]; then
              echo "::error::Expected bundle artifact not found: $a"
              exit 1
            fi
          done

          cliDir="$RUNNER_TEMP/tauri-cli-pin"
          mkdir -p "$cliDir"
          cat > "$cliDir/package.json" <<'PKG'
          {
            "name": "tauri-signer-pin",
            "private": true,
            "dependencies": { "@tauri-apps/cli": "2.11.4" }
          }
          PKG
          # Same pin as the portable step below, plus the linux-x86_64-gnu optional
          # binary so the one pinned lockfile serves both matrix legs (npm skips
          # optional deps whose os/cpu do not match the runner).
          cat > "$cliDir/package-lock.json" <<'PKGLOCK'
          {
            "name": "tauri-signer-pin",
            "version": "1.0.0",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {
              "": {
                "name": "tauri-signer-pin",
                "version": "1.0.0",
                "dependencies": { "@tauri-apps/cli": "2.11.4" }
              },
              "node_modules/@tauri-apps/cli": {
                "version": "2.11.4",
                "resolved": "https://registry.npmjs.org/@tauri-apps/cli/-/cli-2.11.4.tgz",
                "integrity": "sha512-R8xGtMpwyetawSqm9kYOuMmEqkhUbvcUy8n0aNXIxollKBLESUu5f4Fx+64hgASYm1H+jSWq6jCW6zqTnH6hqQ==",
                "bin": { "tauri": "tauri.js" },
                "engines": { "node": ">= 10" },
                "optionalDependencies": {
                  "@tauri-apps/cli-win32-x64-msvc": "2.11.4",
                  "@tauri-apps/cli-linux-x64-gnu": "2.11.4"
                }
              },
              "node_modules/@tauri-apps/cli-win32-x64-msvc": {
                "version": "2.11.4",
                "resolved": "https://registry.npmjs.org/@tauri-apps/cli-win32-x64-msvc/-/cli-win32-x64-msvc-2.11.4.tgz",
                "integrity": "sha512-+vDiqBIU5dMISg/wNvX3sF+ZHfgJGJ5T0AcO+EHNXV9GGAG+P5fzodlDXD3QdKCRgZxMoCm5PPvj3BqLNjBthw==",
                "cpu": [ "x64" ],
                "optional": true,
                "os": [ "win32" ],
                "engines": { "node": ">= 10" }
              },
              "node_modules/@tauri-apps/cli-linux-x64-gnu": {
                "version": "2.11.4",
                "resolved": "https://registry.npmjs.org/@tauri-apps/cli-linux-x64-gnu/-/cli-linux-x64-gnu-2.11.4.tgz",
                "integrity": "sha512-2VRNWl84FOH0m2giiDkO2h0QXlcMJeX+zJDpI5kDIQAx6s+geF3v48F4DXfJez4GS/FdoDGnPnw1C2iYGbQ7bQ==",
                "cpu": [ "x64" ],
                "optional": true,
                "os": [ "linux" ],
                "engines": { "node": ">= 10" }
              }
            }
          }
          PKGLOCK
          (cd "$cliDir" && npm ci --no-audit --no-fund)

          keyFile="$RUNNER_TEMP/hb-updater-signing.key"
          trap 'rm -f "$keyFile"' EXIT
          # printf '%s' writes the exact key: no BOM, no trailing newline, no CRLF —
          # all three corrupt the base64 key and make the CLI fail to decode it.
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$keyFile"
          unset TAURI_SIGNING_PRIVATE_KEY
          for a in "${artifacts[@]}"; do
            node "$cliDir/node_modules/@tauri-apps/cli/tauri.js" signer sign --private-key-path "$keyFile" "$a"
          done

          # Assemble the shared latest.json: read-modify-write, each platform leg
          # merging its own keys into whatever is already published — the same shape
          # and the same narrow lost-update window tauri-action's uploadUpdaterJson
          # had; it has never fired because the legs finish minutes apart.
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p latest.json --clobber \
            || echo "no latest.json on the release yet (first platform leg)"
          cat > "$cliDir/merge-updater-json.js" <<'NODE'
          const fs = require("fs");
          const artifacts = process.argv.slice(2);
          const tag = process.env.GITHUB_REF_NAME;
          const version = tag.replace(/^v/, "");
          const repo = process.env.GITHUB_REPOSITORY;
          // Which latest.json platform keys each bundle artifact serves — what
          // tauri-action's uploadUpdaterJson + updaterJsonPreferNsis used to emit:
          // the bare platform key the updater plugin resolves, plus the
          // bundle-specific variants.
          const keysBySuffix = [
            ["x64-setup.exe", ["windows-x86_64", "windows-x86_64-nsis"]],
            [".AppImage", ["linux-x86_64", "linux-x86_64-appimage"]],
            [".deb", ["linux-x86_64-deb"]],
          ];
          let manifest = fs.existsSync("latest.json")
            ? JSON.parse(fs.readFileSync("latest.json", "utf8"))
            : {};
          manifest.version = version;
          manifest.notes = manifest.notes || "";
          manifest.pub_date = new Date().toISOString();
          manifest.platforms = manifest.platforms || {};
          for (const artifact of artifacts) {
            const name = artifact.split(/[\\/]/).pop();
            const entry = keysBySuffix.find(([suffix]) => name.endsWith(suffix));
            if (!entry) throw new Error("no platform-key mapping for " + name);
            const url = "https://github.com/" + repo + "/releases/download/" + tag + "/" + name;
            const signature = fs.readFileSync(artifact + ".sig", "utf8").trim();
            for (const key of entry[1]) manifest.platforms[key] = { signature: signature, url: url };
          }
          fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2) + "\n");
          NODE
          node "$cliDir/merge-updater-json.js" "${artifacts[@]}"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            "${artifacts[@]/%/.sig}" latest.json

      - name: Sign + publish the portable self-updater artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # devtest v0.12.1 follow-up: the portable build self-updates in place. Publish a STABLE-named
          # exe (no version in the filename — the version lives inside the binary) so
          # `releases/latest/download/Hoardbook.exe` is a fixed URL the in-app updater fetches, plus its
          # minisign signature (SAME key as the NSIS updater) and a `portable.json` manifest.
          #
          # QURATOR-107 hardening: the signer CLI used to come from `npx --yes @tauri-apps/cli@2`,
          # which resolved a floating 2.x off the npm registry at release time and received the
          # signing key + password as argv. It is now installed from the integrity-pinned lockfile
          # below (`npm ci` refuses any tarball whose sha512 differs) and invoked as that exact
          # local file; the key travels env → temp file → `--private-key-path` and the password is
          # read from TAURI_SIGNING_PRIVATE_KEY_PASSWORD, so neither secret is in argv. The temp
          # key file is deleted in `finally` even when signing fails. The CLI is not a frontend
          # dependency, so it gets this dedicated pin rather than floating inside crates/hb-app/ui.
          $exe = "Hoardbook.exe"
          Copy-Item "target/release/hb-app.exe" $exe
          # Absolute path: the signer runs from the pinned-CLI directory below, so a
          # relative $exe would point into that directory instead of at the artifact.
          $exePath = Join-Path $env:GITHUB_WORKSPACE $exe

          $cliDir = Join-Path $env:RUNNER_TEMP "tauri-cli-pin"
          New-Item -ItemType Directory -Force -Path $cliDir | Out-Null
          $pkgJson = @'
          {
            "name": "tauri-signer-pin",
            "private": true,
            "dependencies": { "@tauri-apps/cli": "2.11.4" }
          }
          '@
          $pkgLock = @'
          {
            "name": "tauri-signer-pin",
            "version": "1.0.0",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {
              "": {
                "name": "tauri-signer-pin",
                "version": "1.0.0",
                "dependencies": { "@tauri-apps/cli": "2.11.4" }
              },
              "node_modules/@tauri-apps/cli": {
                "version": "2.11.4",
                "resolved": "https://registry.npmjs.org/@tauri-apps/cli/-/cli-2.11.4.tgz",
                "integrity": "sha512-R8xGtMpwyetawSqm9kYOuMmEqkhUbvcUy8n0aNXIxollKBLESUu5f4Fx+64hgASYm1H+jSWq6jCW6zqTnH6hqQ==",
                "bin": { "tauri": "tauri.js" },
                "engines": { "node": ">= 10" },
                "optionalDependencies": { "@tauri-apps/cli-win32-x64-msvc": "2.11.4" }
              },
              "node_modules/@tauri-apps/cli-win32-x64-msvc": {
                "version": "2.11.4",
                "resolved": "https://registry.npmjs.org/@tauri-apps/cli-win32-x64-msvc/-/cli-win32-x64-msvc-2.11.4.tgz",
                "integrity": "sha512-+vDiqBIU5dMISg/wNvX3sF+ZHfgJGJ5T0AcO+EHNXV9GGAG+P5fzodlDXD3QdKCRgZxMoCm5PPvj3BqLNjBthw==",
                "cpu": [ "x64" ],
                "optional": true,
                "os": [ "win32" ],
                "engines": { "node": ">= 10" }
              }
            }
          }
          '@
          # NoNewline: a trailing newline inside package.json is harmless, but the
          # here-string's closing newline is dropped by assignment, so state it explicitly.
          [IO.File]::WriteAllText((Join-Path $cliDir "package.json"), $pkgJson, [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText((Join-Path $cliDir "package-lock.json"), $pkgLock, [Text.UTF8Encoding]::new($false))

          # Sign with the Tauri signer → `$exe.sig` (base64 minisign signature, the exact format
          # tauri-plugin-updater — and our portable verifier — expect).
          Push-Location $cliDir
          try {
            npm ci --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw "npm ci of the pinned signer CLI failed (exit $LASTEXITCODE)" }
            $keyFile = Join-Path $env:RUNNER_TEMP "hb-updater-signing.key"
            try {
              # WriteAllText writes the exact string: no BOM, no trailing newline, no CRLF —
              # all three corrupt the base64 key and make the CLI fail to decode it.
              [IO.File]::WriteAllText($keyFile, $env:TAURI_SIGNING_PRIVATE_KEY, [Text.UTF8Encoding]::new($false))
              # The CLI rejects --private-key-path while TAURI_SIGNING_PRIVATE_KEY is set, so drop
              # it before invoking; the password comes from its own env var, not argv.
              Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY -ErrorAction SilentlyContinue
              & node (Join-Path $cliDir "node_modules\@tauri-apps\cli\tauri.js") signer sign --private-key-path "$keyFile" "$exePath"
              if ($LASTEXITCODE -ne 0) { throw "tauri signer sign failed (exit $LASTEXITCODE)" }
            } finally {
              Remove-Item $keyFile -Force -ErrorAction SilentlyContinue
            }
          } finally {
            Pop-Location
          }
          $sig = (Get-Content "$exe.sig" -Raw).Trim()
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $url = "https://github.com/${{ github.repository }}/releases/latest/download/Hoardbook.exe"
          $manifest = [ordered]@{
            version   = $version
            platforms = [ordered]@{ "windows-x86_64" = [ordered]@{ url = $url; signature = $sig } }
          } | ConvertTo-Json -Depth 5
          Set-Content -Path "portable.json" -Value $manifest -NoNewline
          gh release upload "$env:GITHUB_REF_NAME" $exe "$exe.sig" portable.json --repo ${{ github.repository }}

  publish-release:
    needs: [create-release, build-tauri]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo ${{ github.repository }}
