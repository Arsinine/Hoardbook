[package]
name    = "hb-dpapi"
version = "0.23.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
# QURATOR-234 adds the ACL surface alongside DPAPI: `Win32_Security_Authorization` carries
# SetNamedSecurityInfoW / the SDDL converter / SE_FILE_OBJECT, and `Win32_Security` carries
# GetSecurityDescriptorDacl, ACL and the DACL_/PROTECTED_DACL_ information flags.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    # QURATOR-352 — windows_build(): RtlGetVersion lives in the Wdk_System_SystemServices module
    # and takes an OSVERSIONINFOW out-param from Win32_System_SystemInformation (both features
    # needed — the link! is in the Wdk module, the struct in the SystemInformation module).
    "Wdk_System_SystemServices",
    "Win32_System_SystemInformation",
] }
