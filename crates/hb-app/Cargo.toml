[package]
name    = "hb-app"
version = "0.18.0"
edition = "2021"
# Keep cargo's build-script fingerprint scan out of the frontend's generated trees.
# These are gitignored and regenerated by npm; only ui/build is embedded (via
# generate_context!). Without this, cargo walks ui/node_modules on every build —
# slow everywhere, and an outright failure on WSL2/DrvFs where the .vite cache
# entries intermittently fail to stat (os error 22).
exclude = ["ui/node_modules", "ui/.svelte-kit", "ui/.vite"]

[lib]
name = "hb_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hb-app"
path = "src/main.rs"

# Headless WAN integration harness (M20 W6, Suite WAN-P — see `src/wan_it/`). Reuses the real
# production presence path from the hb-app lib (the per-contact pill's `fetch_online_presence`
# aggregate); never starts the Tauri/webkit runtime. Mirrors the retired `hb-p2p-it` bin pattern.
[[bin]]
name = "hb-wan-it"
path = "src/bin/hb-wan-it.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hb-core    = { path = "../hb-core" }
hb-net     = { path = "../hb-net" }
# Direct `nostr` dep pinned to hb-core/hb-net's version, with the protocol features the app
# touches (NIP-44 listing crypto via hb-core, NIP-59/17 gift-wrap DMs via hb-net).
nostr      = { version = "=0.43.1", features = ["nip44", "nip59"] }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
anyhow     = { workspace = true }
chrono     = { workspace = true }
tokio      = { workspace = true }
tracing    = { workspace = true }
# v0.12.10 diagnostic build — file-based evidence trail for the presence-beacon wedge.
# Installed once in `setup` (after `app_data_dir` resolves); never panics on init failure.
tracing-subscriber = { workspace = true }
tracing-appender   = { workspace = true }
hex        = { workspace = true }
zeroize    = { workspace = true }
rand       = "0.8"
# M16 W4: decode a base64-pasted `.hbmanifest` (the file-picker's paste fallback). Pinned to the
# version hb-core already locks — a dependency edge, no new package in Cargo.lock.
base64     = "0.22"
# Whole-directory backup archive (M5). Restore treats every entry as hostile input
# (path-traversal / symlink / tar-bomb guards).
tar        = "0.4"

tauri               = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
sha2    = "0.10"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# Portable self-updater (Windows): fetch the signed portable binary and swap the running exe in place.
# Verification reuses the SAME minisign key + `minisign-verify` crate as the NSIS updater (byte-identical
# to tauri-plugin-updater's `verify_signature`), so no new trust root. `reqwest`/`semver`/`minisign-verify`
# are already in the lock (pinned to those versions) — only `self_replace` is a new package.
reqwest         = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs"] }
semver          = "1"
minisign-verify = "0.2"
self-replace    = "1"
tempfile        = "3"
globset = "0.4"
# M18 W1 — the manifest plane. Returns under INV-4′ ("Hoardbook moves no COLLECTION FILES"), which
# replaced the retired v0.9.6 "moves no bytes" rule; the plane is limited to `ManifestPayload` by the
# four mechanisms in `transport_payload.rs` + the rewritten CI sweep, not by this dep's absence.
# `default-features = false` + `tls-ring`: no metrics, no portmapper — the same minimal surface the
# retired plane pinned.
# QURATOR-68: `unstable-net-report` is outside iroh's semver (they may break it in a patch). The owner
# accepted that risk explicitly 2026-08-13: it is the one feature that lets us read the relay-observed
# mapped address + `mapping_varies_by_dest_ipv4` from an endpoint the app already binds, so the NAT
# classifier (`net::classify_nat`) gets real inputs instead of staying dead code. If iroh breaks it
# under us, the symptom is a compile error in `nat.rs` (not a silent regression), and we pin a working
# patch version.
iroh    = { version = "1.0", default-features = false, features = ["tls-ring", "unstable-net-report"] }
# M9 snapshot auto-update: cross-platform filesystem watcher (inotify / FSEvents /
# ReadDirectoryChangesW). Kept behind a thin wrapper (`spawn_fs_watcher`) so the OS watcher is never
# in a unit test — the pure `watch_plan` is fake-clock tested. `async-trait` gives the injectable
# `PublishSink` seam the watch loop publishes through, so the loop is testable with a fake sink (no
# RelayClient).
notify      = "6"
async-trait = "0.1"
# rustls is an UNCONDITIONAL dependency: both the production app (lib.rs setup closure) and the
# hb-wan-it harness (wan_it::run) call `rustls::crypto::ring::default_provider().install_default()`
# at startup. The lock resolves rustls with BOTH providers compiled in (iroh `tls-ring` brings
# `ring`, reqwest `rustls` brings `aws-lc-rs`), so rustls cannot auto-pick a process default and
# any provider-less TLS use panics (rustls 0.23 `crypto/mod.rs` CryptoProvider resolution). The
# 2026-08-04 v0.12.11 log falsified the earlier claim that the production app got a provider as a
# side effect of binding the iroh endpoint — that was a RACE the app lost 12 times in 32 s at
# launch. The explicit install in lib.rs is load-bearing for production, not redundant; do not
# remove it on the assumption that iroh installs one.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
hb-dpapi = { path = "../hb-dpapi" }

# Single-instance enforcement (M8) — desktop-only; the plugin (and the concern) does not exist on
# mobile, so gate the dependency itself off the mobile targets, not just its usage.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"
