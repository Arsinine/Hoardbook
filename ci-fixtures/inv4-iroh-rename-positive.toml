# Positive control fixture for the manifest-side iroh detector in
# .github/workflows/ci.yml (step "INV-4′ manifest-side iroh detector"). NOT a manifest any
# build reads: it lives under ci-fixtures/, and the production detector scans only
# crates/*/Cargo.toml and the workspace root, so this file is inert data. The self-test step
# in ci.yml runs the SAME awk-and-allowlist pipeline against it and asserts every rename
# REDS and every negative stays clean.
#
# It holds the evasion from the 2026-09-16 scan (QURATOR-281): a dependency renamed via
# package = "iroh", so every source file would import the crate under the local name and the
# token the iroh-surface enumeration keys on appears in NO .rs file. Six declarations cover
# the five valid spellings: the plain [dependencies] rename, a target-section rename, a
# dotted [dependencies.NAME] section, a QUOTED dep key, a QUOTED section header, and a
# SINGLE-QUOTED package value (TOML literal string). The last three were the detector's
# misses (QURATOR-281 defect 1) and the trailing-comment lines below were its false
# positive (defect 2) — a fixture that only demonstrates the spellings already caught is
# exactly how a porous detector passes its own self-test. Comments are stripped before
# matching, with a # inside a quoted string NOT treated as a comment start, so the
# http-body line — whose comment names package = "iroh" itself — must stay clean.

[dependencies]
quic = { package = "iroh", version = "1.0", default-features = false }
"quic-q" = { package = "iroh", version = "1.0" }
quic-lit = { package = 'iroh', version = "1.0" }
serde = "1.0.209"
http-body = "1.0"  # trailing-comment negative: naming package = "iroh" here must NOT red (QURATOR-281)
something = "x"  # not iroh, see QURATOR-281

[target.'cfg(unix)'.dev-dependencies]
quic-helper = { package = "iroh", version = "1.0" }

[dependencies.quic-section]
package = "iroh"

[dependencies."quic-dotted"]
version = "1.0"
package = "iroh"
