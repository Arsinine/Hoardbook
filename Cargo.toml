[workspace]
members = ["crates/hb-core", "crates/hb-net", "crates/hb-app", "crates/hb-dpapi", "crates/hb-it"]
resolver = "2"

[patch.crates-io]
wmi = { path = "vendor/wmi" }

[workspace.dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "1"
anyhow      = "1"
chrono      = { version = "0.4", features = ["serde"] }
tokio       = { version = "1", features = ["full"] }
tracing            = "0.1"
# v0.12.10 diagnostic build: a file-based tracing subscriber so the beacon loop's wedge is
# diagnosable in the shipped (no-devtools) Windows build. tracing-subscriber is already a
# transitive dep in the lock (0.3.x); tracing-appender is new and pinned to match the
# subscriber's minor (the builder().max_log_files() API landed in 0.2.3).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender   = "0.2"
hex         = "0.4"
zeroize     = { version = "1", features = ["derive"] }

# --- M5 portable backup crypto: Argon2id KDF + NFKC passphrase normalization.
#     XChaCha20-Poly1305 comes from hb-core's existing `chacha20poly1305` dep (the
#     `xchacha20poly1305` feature is enabled there). ---
argon2                = "0.5"
unicode-normalization = "0.1"

# --- v0.9 Nostr relay client (M2). nostr-sdk default features are EMPTY (no NIPs), so the
#     NIP-44/NIP-59 features must be requested explicitly. Pinned to the M0-verified surface
#     (=0.44.1) alongside hb-core's nostr =0.44.8 so a silent minor bump can't break interop. ---
nostr-sdk   = { version = "=0.44.1", default-features = false, features = ["nip44", "nip59"] }
